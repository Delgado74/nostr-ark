name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Initialize Capacitor
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Android for barcode scanning
        run: |
          # Add camera permissions
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.FLASHLIGHT"/>\n</manifest>|' android/app/src/main/AndroidManifest.xml

          # Add ML Kit metadata inside <application> tag
          sed -i 's|android:theme="@style/AppTheme">|android:theme="@style/AppTheme">\n        <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/>|' android/app/src/main/AndroidManifest.xml

          # Enable data binding in build.gradle
          sed -i '/android {/a\    buildFeatures {\n        dataBinding true\n    }\n    dataBinding {\n        enabled = true\n    }' android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        if: steps.find-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: nostr-ark-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
